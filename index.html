
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>国旗クイズ</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  font-family: "Meiryo", "Noto Sans JP", sans-serif;
  background: #f3f6fb;
  color: #263238;
  text-align: center;
}

.container {
  max-width: 760px;
  margin: 0 auto;
}

h1 {
  margin: 20px 0 10px;
  font-size: 34px;
}

.subtitle {
  color: #667085;
  margin-bottom: 35px;
}

button {
  border: none;
  border-radius: 12px;
  padding: 15px 25px;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
  margin: 8px;
  background: #2463eb;
  color: white;
  min-width: 180px;
}

button:hover {
  opacity: 0.85;
}

button:disabled {
  opacity: 0.5;
  cursor: default;
}

.secondary {
  background: #64748b;
}

.pause-button {
  background: #e58b16;
  min-width: 160px;
  margin-top: 20px;
}

.hidden {
  display: none !important;
}

#quizScreen,
#resultScreen,
#reviewScreen {
  display: none;
}

.progress {
  margin: 15px 0;
  font-size: 18px;
  color: #475569;
}

.flag-area {
  min-height: 270px;
  display: flex;
  justify-content: center;
  align-items: center;
  margin: 15px auto;
  padding: 15px;
}

.flag {
  width: min(90%, 480px);
  max-height: 270px;
  object-fit: contain;
  border-radius: 5px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.12);
  background: white;
}

.timer-wrap {
  margin: 15px 0;
}

.timer {
  font-size: 48px;
  font-weight: bold;
  color: #2463eb;
}

.timer-label {
  font-size: 14px;
  color: #64748b;
}

.answer-box {
  margin: 20px auto;
  padding: 18px;
  max-width: 550px;
  background: #e5f4e9;
  border-radius: 12px;
  color: #176b35;
  font-size: 30px;
  font-weight: bold;
}

.pause-message {
  font-size: 20px;
  font-weight: bold;
  color: #d97706;
  margin: 15px;
}

.result-title {
  font-size: 28px;
  margin: 30px 0;
}

.review-list {
  text-align: left;
  margin: 20px auto;
}

.review-item {
  display: flex;
  align-items: center;
  gap: 18px;
  background: white;
  padding: 12px;
  margin: 10px 0;
  border-radius: 10px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.06);
}

.review-item img {
  width: 110px;
  max-height: 70px;
  object-fit: contain;
}

.review-number {
  width: 35px;
  color: #64748b;
  font-weight: bold;
}

.review-name {
  font-size: 19px;
  font-weight: bold;
}

@media (max-width: 500px) {
  body {
    padding: 10px;
  }

  h1 {
    font-size: 28px;
  }

  button {
    width: 90%;
    margin: 7px auto;
  }

  .flag-area {
    min-height: 210px;
  }

  .flag {
    max-height: 210px;
  }

  .answer-box {
    font-size: 24px;
  }

  .review-item img {
    width: 80px;
  }
}
</style>
</head>

<body>
<div class="container">

  <h1>🌍 国旗クイズ</h1>
  <div class="subtitle">国旗を見て、国名を当ててみよう！</div>

  <!-- トップ画面 -->
  <section id="homeScreen">
    <button onclick="startQuiz(10)">10問スタート</button>
    <button onclick="startQuiz(20)">20問スタート</button>
    <button onclick="startQuiz(0)">エンドレス</button>
  </section>

  <!-- クイズ画面 -->
  <section id="quizScreen">

    <div class="progress" id="progress"></div>

    <div class="flag-area">
      <img id="flagImage" class="flag" src="" alt="国旗">
    </div>

    <div class="timer-wrap" id="timerWrap">
      <div class="timer" id="timer">5</div>
      <div class="timer-label">秒後に正解を表示</div>
    </div>

    <div id="answerBox" class="answer-box hidden">
      <span id="answerName"></span>
    </div>

    <div id="pauseMessage" class="pause-message hidden">
      一時停止中
    </div>

    <button id="pauseButton" class="pause-button"
      onclick="togglePause()">ちょっと待って</button>

  </section>

  <!-- 結果画面 -->
  <section id="resultScreen">
    <div class="result-title">🎉 クイズ終了！</div>
    <p id="resultText"></p>

    <button onclick="showReview()">今回の問題一覧を見る</button>
    <br>
    <button onclick="startQuiz(lastMode)">もう一度遊ぶ</button>
    <button class="secondary" onclick="goHome()">トップに戻る</button>
  </section>

  <!-- 振り返り画面 -->
  <section id="reviewScreen">
    <h2>今回の問題一覧</h2>
    <p>出題された順番に確認できます。</p>

    <div id="reviewList" class="review-list"></div>

    <button onclick="startQuiz(lastMode)">もう一度遊ぶ</button>
    <button class="secondary" onclick="goHome()">トップに戻る</button>
  </section>

</div>

["im","マン島"],["io","イギリス領インド洋地域"],["je","ジャージー"],
["ky","ケイマン諸島"],["mf","サン・マルタン"],["mo","マカオ"],
["mp","北マリアナ諸島"],["mq","マルティニーク"],["ms","モントセラト"],
["nc","ニューカレドニア"],["nf","ノーフォーク島"],["nu","ニウエ"],
["pf","フランス領ポリネシア"],["pm","サンピエール島・ミクロン島"],
["pn","ピトケアン諸島"],["pr","プエルトリコ"],["ps","パレスチナ"],
["re","レユニオン"],["sh","セントヘレナ"],["sj","スヴァールバル諸島・ヤンマイエン島"],
["sx","シント・マールテン"],["tc","タークス・カイコス諸島"],
["tf","フランス領南方・南極地域"],["tk","トケラウ"],["um","合衆国領有小離島"],
["vg","イギリス領ヴァージン諸島"],["vi","アメリカ領ヴァージン諸島"],
["wf","ウォリス・フツナ"],["yt","マヨット"]

// クイズ設定
const QUESTION_SECONDS = 5;
const ANSWER_SECONDS = 2;

let mode = 10;
let lastMode = 10;
let questionNumber = 0;
let questions = [];
let currentCountry = null;
let phase = "question";
let remaining = QUESTION_SECONDS;
let timerId = null;
let paused = false;

// 画面要素
const homeScreen = document.getElementById("homeScreen");
const quizScreen = document.getElementById("quizScreen");
const resultScreen = document.getElementById("resultScreen");
const reviewScreen = document.getElementById("reviewScreen");

const flagImage = document.getElementById("flagImage");
const timerEl = document.getElementById("timer");
const timerWrap = document.getElementById("timerWrap");
const answerBox = document.getElementById("answerBox");
const answerName = document.getElementById("answerName");
const progress = document.getElementById("progress");
const pauseButton = document.getElementById("pauseButton");
const pauseMessage = document.getElementById("pauseMessage");

// 配列をシャッフル
function shuffle(array) {
  const result = [...array];

  for (let i = result.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [result[i], result[j]] = [result[j], result[i]];
  }

  return result;
}

// 画面切り替え
function showScreen(screen) {
  homeScreen.style.display = "none";
  quizScreen.style.display = "none";
  resultScreen.style.display = "none";
  reviewScreen.style.display = "none";

  screen.style.display = "block";
}

// クイズ開始
function startQuiz(count) {
  clearInterval(timerId);

  mode = count;
  lastMode = count;

  questionNumber = 0;
  questions = shuffle(countries);

  if (count > 0) {
    questions = questions.slice(0, count);
  }

  paused = false;
  pauseMessage.classList.add("hidden");
  pauseButton.textContent = "ちょっと待って";

  showScreen(quizScreen);
  nextQuestion();
}

// 次の問題
function nextQuestion() {
  clearInterval(timerId);

  paused = false;
  pauseMessage.classList.add("hidden");
  pauseButton.textContent = "ちょっと待って";

  questionNumber++;

  if (mode > 0 && questionNumber > mode) {
    finishQuiz();
    return;
  }

  if (mode === 0 && questionNumber > questions.length) {
    questions = questions.concat(shuffle(countries));
  }

  currentCountry = questions[questionNumber - 1];

  phase = "question";
  remaining = QUESTION_SECONDS;

  progress.textContent =
    mode === 0
      ? `第 ${questionNumber} 問`
      : `${questionNumber} / ${mode} 問`;

  flagImage.src =
    `https://flagcdn.com/w640/${currentCountry[0]}.png`;

  flagImage.alt = currentCountry[1] + "の国旗";

  answerName.textContent = currentCountry[1];
  answerBox.classList.add("hidden");

  // 次の問題ではカウントダウンを再表示
  timerWrap.classList.remove("hidden");

  timerEl.textContent = remaining;

  startTimer();
}

// タイマー開始
function startTimer() {
  clearInterval(timerId);

  timerId = setInterval(() => {
    if (paused) return;

    remaining--;

    if (phase === "question") {
      timerEl.textContent = remaining;

      if (remaining <= 0) {
        clearInterval(timerId);
        revealAnswer();
      }

    } else if (phase === "answer") {

      // 正解表示中は数字を表示しない
      if (remaining <= 0) {
        clearInterval(timerId);
        nextQuestion();
      }
    }

  }, 1000);
}

// 正解表示
function revealAnswer() {
  phase = "answer";
  remaining = ANSWER_SECONDS;

  answerName.textContent = currentCountry[1];
  answerBox.classList.remove("hidden");

  // 正解表示中はカウントダウンを隠す
  timerWrap.classList.add("hidden");

  startTimer();
}

// 一時停止・再開
function togglePause() {
  if (paused) {
    paused = false;

    pauseMessage.classList.add("hidden");
    pauseButton.textContent = "ちょっと待って";

    startTimer();

  } else {
    paused = true;

    pauseMessage.classList.remove("hidden");
    pauseButton.textContent = "再開する";

    clearInterval(timerId);
  }
}

// クイズ終了
function finishQuiz() {
  clearInterval(timerId);

  paused = false;

  showScreen(resultScreen);

  document.getElementById("resultText").textContent =
    `${mode}問のクイズが終了しました！`;
}

// 今回の問題一覧
function showReview() {
  clearInterval(timerId);

  const reviewList = document.getElementById("reviewList");
  reviewList.innerHTML = "";

  questions.slice(0, mode).forEach((country, index) => {
    const item = document.createElement("div");
    item.className = "review-item";

    const number = document.createElement("div");
    number.className = "review-number";
    number.textContent = index + 1;

    const img = document.createElement("img");
    img.src = `https://flagcdn.com/w320/${country[0]}.png`;
    img.alt = country[1] + "の国旗";

    const name = document.createElement("div");
    name.className = "review-name";
    name.textContent = country[1];

    item.appendChild(number);
    item.appendChild(img);
    item.appendChild(name);

    reviewList.appendChild(item);
  });

  showScreen(reviewScreen);
}

// トップ画面に戻る
function goHome() {
  clearInterval(timerId);

  paused = false;
  pauseMessage.classList.add("hidden");

  showScreen(homeScreen);
}
</script>

</html>
